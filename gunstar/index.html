<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gunstar Remix</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #ddd; font-family: monospace; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #game canvas { image-rendering: pixelated; max-width: 100vw; }
  p { font-size: 13px; text-align: center; padding: 0 16px; }
</style>
</head>
<body>
<div id="game"></div>
<p>Arrows: move/aim &nbsp; Z: jump (Down+Z: slide) &nbsp; X: shoot &nbsp; C (hold): plant feet and aim</p>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<script src="game.js"></script>
</body>
</html>
